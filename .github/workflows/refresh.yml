name: refresh-dashboard

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --upgrade pip yfinance

      - name: Refresh dashboard
        run: ./refresh.sh

      - name: Commit & push if changed
        run: |
          git config user.name "canslim-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes — upstream hasn't published anything new."
            exit 0
          fi
          git add -A
          git commit -m "auto-refresh $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
